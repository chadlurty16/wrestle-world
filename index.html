<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<meta name="color-scheme" content="dark">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<title>Wrestle World: Pro Wrestling Career RPG</title>
<style>
:root{--bg:#08070a;--panel:#100e13;--card:#15121a;--line:#2a2230;--fg:#f1eef4;--dim:#9d93a8;--tc:#e8364a;--tc2:#f5c542;--tct:#18050a;--g:#4ade80;--r:#f87171;--y:#fbbf24;--b:#60a5fa;--p:#c084fc;
--disp:"Oswald","Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Impact,sans-serif;--body:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1000px 480px at 80% -140px,rgba(232,54,74,.18),transparent 70%) fixed,radial-gradient(800px 400px at -10% 110%,rgba(245,197,66,.07),transparent 70%) fixed,var(--bg)}
#hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#120c12,#09070b);box-shadow:0 8px 24px rgba(0,0,0,.55)}
#hdr::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--tc),var(--tc2) 60%,transparent)}
#top{max-width:1000px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:52px}
.brand{font:italic 700 22px/1 var(--disp);letter-spacing:.1em;color:var(--tc)}
.tb-n{font:italic 700 20px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.tb-i{font-size:13.5px;color:#cfc6d8;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tb-i.r{color:var(--r)}
.mini{display:inline-block;width:46px;height:7px;background:#1d1722;overflow:hidden;border-radius:2px}.mini>i{display:block;height:100%}
.mini.wide{width:90px}
#app{max-width:1000px;margin:0 auto;padding:0 16px 40px}
#main{padding:6px 0 4px}
h2{color:#fff;font:italic 700 32px/1.1 var(--disp);letter-spacing:.01em;margin:18px 0 12px;text-transform:uppercase}
h2::after{content:"";display:block;width:64px;height:4px;margin-top:8px;background:linear-gradient(90deg,var(--tc),var(--tc2));transform:skewX(-24deg);transform-origin:left}
h3{color:#fff;font:italic 700 20px/1.2 var(--disp);letter-spacing:.04em;margin:22px 0 10px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
h3::before{content:"";width:6px;height:17px;background:var(--tc);transform:skewX(-20deg);flex:0 0 auto}
h3 .dim{font:600 13.5px var(--body);text-transform:none}
p{margin:8px 0}
.dim{color:var(--dim)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.small{font-size:13px}.center{text-align:center}
.hl{color:var(--tc2);font-weight:700}
code{background:#1b1520;padding:1px 5px;border-radius:3px}
.eyebrow{font:800 11.5px/1.2 var(--body);letter-spacing:.2em;color:var(--tc2)}
.logo-ico{text-align:center;font-size:58px;margin-top:34px;line-height:1;filter:drop-shadow(0 8px 20px rgba(232,54,74,.4))}
.logo{text-align:center;font:italic 700 74px/.95 var(--disp);letter-spacing:.03em;margin:12px 0 6px;color:#fff;text-shadow:4px 4px 0 var(--tc),8px 8px 0 rgba(0,0,0,.4)}
.logo2{text-align:center;color:var(--tc2);font:italic 600 16px/1 var(--disp);letter-spacing:.38em;margin-bottom:22px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.feat>div{background:linear-gradient(160deg,#1a141e,#0f0c12);border-left:4px solid var(--tc);padding:12px 14px;font-size:13.5px;color:var(--dim)}
.feat b{display:block;color:#fff;font:italic 700 18px/1.2 var(--disp);letter-spacing:.03em;margin:4px 0 2px;text-transform:uppercase}
.fi{font-size:22px}
.card{background:linear-gradient(160deg,#17121b,#0f0c12);border:1px solid var(--line);padding:12px 16px;margin:12px 0;border-radius:4px}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,rgba(232,54,74,.38),#16101a 55%,#0e0b11);border-left:6px solid var(--tc);padding:16px 20px;margin:14px 0;border-radius:2px}
.hero::after{content:"";position:absolute;right:30px;top:-20px;bottom:-20px;width:110px;background:repeating-linear-gradient(90deg,rgba(245,197,66,.13) 0 10px,transparent 10px 24px);transform:skewX(-24deg);pointer-events:none}
.hero-t{font:italic 700 36px/1.05 var(--disp);color:#fff;margin:4px 0;position:relative;z-index:1;text-transform:uppercase;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-s{color:#d5cbdc;font-size:14.5px;position:relative;z-index:1}
.hero-s b{color:#fff}
.hero .chips{position:relative;z-index:1}
.tag{display:inline-block;font:italic 700 13px/1 var(--disp);letter-spacing:.18em;color:var(--tct);background:var(--tc2);padding:7px 16px 6px;margin-top:14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px;color:#6f6579;letter-spacing:.05em;margin-top:14px;text-transform:uppercase;font-weight:700}
.crumbs span{padding:3px 8px;background:#161119;border-radius:3px}.crumbs span.done{color:#c9b5d0;background:#22182a}.crumbs span.on{background:var(--tc);color:#fff}
.obj{background:#1a1420;border:1px dashed #4a3550;padding:10px 14px;margin:12px 0;font-size:14.5px;border-radius:4px}
.agenda{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:4px}
.agenda>div{padding:6px 0;border-bottom:1px solid #1f1924;font-size:14.5px}.agenda>div:last-child{border:0}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.meter{background:linear-gradient(160deg,#17121b,#0f0c12);border:1px solid var(--line);padding:10px 14px;border-radius:4px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.ml{font-weight:700}.mv{font:italic 700 22px/1 var(--disp)}
.bar{height:8px;background:#060508;overflow:hidden;margin:8px 0 4px;transform:skewX(-24deg)}.bar>i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tile2{background:linear-gradient(160deg,#17121b,#0f0c12);border:1px solid var(--line);border-top:3px solid rgba(232,54,74,.75);padding:9px 13px;border-radius:3px}
.tl{font:700 10.5px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tv{font:italic 700 25px/1.15 var(--disp);color:#fff;margin-top:3px}.tv.sm{font-size:17px}
.th{font-size:12px;color:var(--dim);line-height:1.35;margin-top:2px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);background:var(--panel);border-radius:4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font:800 10.5px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:9px 10px;border-bottom:2px solid rgba(232,54,74,.55);white-space:nowrap;background:#0d0a10}
table.t td{padding:7px 10px;border-bottom:1px solid #1d1722;vertical-align:middle}
table.t tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.rb{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:26px;padding:0 8px;font:italic 700 16px/1 var(--disp);color:#0b0a0d;cursor:help;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);vertical-align:middle}
.rb.s5{background:linear-gradient(135deg,#f5d0fe,#a855f7)}.rb.s4{background:linear-gradient(135deg,#fde68a,#f59e0b)}.rb.s3{background:linear-gradient(135deg,#86efac,#22c55e)}.rb.s2{background:linear-gradient(135deg,#93c5fd,#3b82f6)}.rb.s1{background:#6b6577;color:#fff}.rb.s0{background:#3b3442;color:#d4cddc}
.rb.sm{min-width:32px;height:22px;font-size:14px}.rb.lg{min-width:62px;height:46px;font-size:30px}
.ovrbig{display:flex;align-items:center;gap:14px;margin:10px 0}.ovrbig .rb{min-width:96px;height:76px;font-size:54px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:3px;background:#251e2b;color:var(--fg);white-space:nowrap;line-height:1.5}
.pill.g{background:#123222;color:#86efac}.pill.r{background:#3a1a1e;color:#fca5a5}.pill.y{background:#3a2e10;color:#fcd34d}.pill.b{background:#14284a;color:#93c5fd}.pill.p{background:#2e1b42;color:#d8b4fe}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.efx{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;padding:10px;background:#0d0a10;border:1px solid var(--line);border-radius:4px}
.note{border-left:4px solid var(--b);background:rgba(96,165,250,.08);padding:9px 13px;margin:10px 0;font-size:14.5px;border-radius:0 4px 4px 0}
.note.good{border-color:var(--tc2);background:rgba(245,197,66,.08)}.note.bad{border-color:var(--r);background:rgba(248,113,113,.08)}
details.more{margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:4px}
details.more summary{cursor:pointer;padding:9px 13px;font-weight:700;color:var(--tc2)}
details.more>div{padding:4px 13px 10px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#2a2230;color:var(--dim);font-size:11px;font-weight:700;cursor:help;position:relative;vertical-align:1px}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:130%;transform:translateX(-50%);width:230px;background:#1e1824;color:var(--fg);padding:8px 10px;border:1px solid var(--line);font-size:12.5px;font-weight:400;line-height:1.4;z-index:30;border-radius:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 18px;margin:10px 0}
.srow{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;font-size:14px}
.srow.key span:first-child{color:var(--tc2);font-weight:700}
.sbar{height:8px;background:#060508;overflow:hidden;transform:skewX(-20deg)}.sbar>i{display:block;height:100%}
.srow b{text-align:right;font-family:var(--disp);font-style:italic}
/* match */
.mcard{background:linear-gradient(135deg,#1d1016,#0f0c12);border:1px solid #3a2330;border-top:3px solid var(--tc);padding:12px 16px;margin:12px 0;border-radius:4px}
.mc-show{font:700 11.5px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mc-show b{color:var(--tc2)}
.mc-type{font:italic 700 15px/1.3 var(--disp);letter-spacing:.08em;color:var(--tc2);text-transform:uppercase;margin:3px 0 6px}
.mc-vs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:italic 700 22px/1.2 var(--disp);text-transform:uppercase;color:#fff}
.vs{color:var(--tc);font-size:16px;letter-spacing:.12em}
.phbar{display:flex;gap:4px;margin:10px 0 6px;flex-wrap:wrap}
.phbar span{flex:1 1 auto;text-align:center;font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:7px 6px;background:#1a1420;color:#7b7186;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.phbar span.done{background:#3a1d26;color:#d9a3ae}.phbar span.on{background:var(--tc);color:#fff}
.crowdm{font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
.pbp:empty{display:none}
.pbp{background:#0d0a10;border:1px solid var(--line);padding:6px 14px;margin:10px 0;border-radius:4px;max-height:none}
.pbp>div,.pbp-i{padding:6px 0;border-bottom:1px solid #1d1722;font-size:15px}.pbp>div:last-child{border:0}
.stars-big{font-size:34px;color:var(--tc2);letter-spacing:.06em;margin:12px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stars-big span{font:600 14px var(--body);color:var(--dim);letter-spacing:0}
.big-moment{background:linear-gradient(90deg,rgba(245,197,66,.18),transparent);border-left:4px solid var(--tc2);padding:10px 14px;margin:10px 0;font-weight:700;color:#fff}
.book{background:var(--panel);border:1px solid var(--line);padding:8px 12px;margin:8px 0;border-radius:4px}
.news>div{padding:7px 0;border-bottom:1px solid #1d1722;font-size:14.5px}
textarea,input[type=text]{width:100%;background:#0d0a10;color:var(--fg);border:1px solid #3a2f42;padding:10px 12px;font:15px var(--body);border-radius:4px;margin:6px 0}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
input[type=text]:focus,textarea:focus{outline:2px solid var(--tc);border-color:transparent}
/* choices */
#choices{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.sec-h{font:800 11px/1 var(--body);letter-spacing:.22em;color:var(--dim);margin:12px 0 2px;padding-left:2px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px}
button.ch{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:linear-gradient(160deg,#18131c,#110e14);border:1px solid #2c2433;color:var(--fg);padding:11px 14px;font:15.5px/1.35 var(--body);cursor:pointer;border-radius:4px;transition:background .12s,border-color .12s,transform .12s;min-height:48px}
button.ch:hover,button.ch:focus-visible{background:#221a28;border-color:var(--tc);outline:none}
button.ch:active{transform:translateY(1px)}
button.ch .num{flex:0 0 auto;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:#2a2230;color:var(--tc2);font:italic 700 14px/1 var(--disp);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);margin-top:1px}
button.ch .ico{flex:0 0 auto;font-size:19px;line-height:1.3}
button.ch .lbl{flex:1 1 auto;min-width:0}
button.ch .sub{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
button.ch .why{display:block;font-size:12px;color:var(--y);margin-top:2px}
button.ch.hi{background:linear-gradient(120deg,#5a1622,#2a0f17);border-color:var(--tc)}
button.ch.hi .num{background:var(--tc);color:#fff}
button.ch.hl{border-color:var(--tc2)}
button.ch.danger{border-color:#5a2a2a}button.ch.danger .lbl{color:#fca5a5}
button.ch.xl{font:italic 700 19px/1.2 var(--disp);letter-spacing:.05em;text-transform:uppercase;padding:14px 16px}
button.ch.dis,button.ch[disabled]{opacity:.5;cursor:not-allowed}
button.ch.tile{min-height:64px}
#foot{max-width:1000px;margin:0 auto;padding:0 16px 22px;color:#5e5568;font-size:12px}
#foot kbd{border:1px solid #3a3042;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:700 11px/16px var(--body);color:#9d93a8}
@media (max-width:640px){
 body{font-size:15px}
 #top{padding:9px 12px 8px;gap:4px 10px}.tb-x{display:none}.tb-n{font-size:17px}
 #app{padding:0 12px 30px}
 h2{font-size:26px}.logo{font-size:50px}.logo2{font-size:12px;letter-spacing:.25em}
 .feat{grid-template-columns:1fr}.hero-t{font-size:28px}
 .meters{grid-template-columns:1fr 1fr;gap:8px}.meter{padding:8px 10px}.mh{font-size:13px}.mv{font-size:19px}.tiles{grid-template-columns:1fr 1fr;gap:8px}.tv{font-size:21px}
 .tgrid{grid-template-columns:1fr 1fr}
 button.ch{padding:10px 11px;font-size:14.5px;gap:9px}
 button.ch.tile{min-height:58px}button.ch.tile .sub{display:none}
 .mc-vs{font-size:18px}.srow{grid-template-columns:95px 1fr 30px}
 table.t{font-size:13px}
}
@media (max-width:380px){.tgrid{grid-template-columns:1fr}}
/* ---------- phone / installed-app polish: safe areas (notch, home bar), no double-tap zoom, no sideways scroll ---------- */
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-size-adjust:100%;overflow-x:hidden}
@supports (overflow-x:clip){html{overflow-x:clip}}
body{min-height:100dvh;overflow-x:clip;overscroll-behavior-x:none}
button,summary,label,a,.tip{touch-action:manipulation}
#hdr{padding-top:env(safe-area-inset-top,0px)}
#top,#app,#foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#foot{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#main,#choices{min-width:0;overflow-wrap:anywhere}
img,svg,video{max-width:100%}
.filebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:6px 0;padding:10px 14px;background:#1b1520;border:1px dashed #4a3550;border-radius:4px;color:var(--tc2);font-weight:700;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tch-only{display:none}
#ww-upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:12px;max-width:calc(100% - 24px);background:#1d1520;border:1px solid var(--tc);border-radius:6px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:14px}
#ww-upd button{min-height:40px;padding:0 14px;background:var(--tc);color:#fff;border:0;border-radius:4px;font:700 14px var(--body);cursor:pointer}
@media (max-width:640px){
 #top,#app,#foot{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 #app{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
}
@media (pointer:coarse){
 textarea,input[type=text],input[type=number],select{font-size:16px}
 .tip{width:24px;height:24px;font-size:12px;margin-left:4px}
 details.more summary{padding:12px 14px;min-height:44px}
 button.ch{min-height:50px}
 .kbd-only{display:none}.tch-only{display:inline}
}
@media (display-mode:standalone){body{-webkit-user-select:none;user-select:none}textarea,input{-webkit-user-select:text;user-select:text}}
</style>

<body>
<div id="hdr"><div id="top"></div></div>
<div id="app"><div id="main"><noscript><p>Wrestle World needs JavaScript enabled.</p></noscript></div><div id="choices"></div></div>
<div id="foot"><span class="kbd-only">Press <kbd>1</kbd>–<kbd>9</kbd> to choose (type two digits quickly for 10+). <kbd>Esc</kbd> = Back. </span><span class="tch-only">Tap a button to choose. </span>Progress autosaves on this device; back it up from Settings or "Backup &amp; restore saves" on the title screen. Real names are used in a fictional story, and there's a fictional-only mode in Settings.</div>
<script>
/* ===================== WRESTLE WORLD: UTIL ===================== */
"use strict";
let G=null;
const R={
 int:(a,b)=>Math.floor(Math.random()*(b-a+1))+a,
 f:(a,b)=>Math.random()*(b-a)+a,
 pick:a=>a[Math.floor(Math.random()*a.length)],
 chance:p=>Math.random()<p,
 gauss:()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);},
 shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
 wpick:(items,wf)=>{let tot=0;const ws=items.map(i=>{const w=Math.max(0,wf(i));tot+=w;return w;});if(tot<=0)return null;let r=Math.random()*tot;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i];}return items[items.length-1];}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function bkPidW(){return G&&G.mode==="booker"&&G.bk?G.bk.pid:null;}
function simWorldWeek(){const BKP=bkPidW();
 for(const pid in G.P){const p=G.P[pid];if(pid===BKP)continue;
  if(p.r){
   for(const b of p.brands){const ple=pleFor(pid,b.id);if(!ple)continue;
    for(const tid of p.titles){const t=G.T[tid];if(t.b!==b.id&&!(t.b==="all"))continue;if(t.h.indexOf("me")>=0)continue;
     if(t.h.some(h=>G.car.partner===h&&G.T[tid].h.indexOf("me")>=0))continue;
     if(R.chance(ple.size>=3?.33:.18))aiTitleChange(tid);else t.d++;}
   }
  }else if(woy()%4===0){
   for(const tid of p.titles){const t=G.T[tid];if(t.h.indexOf("me")>=0)continue;if(R.chance(.12))aiTitleChange(tid);else if(R.chance(.5))t.d++;}
  }
 }
 // fictional talent drifts
 if(G.wk%4===0)for(const id in G.W){const w=G.W[id];if(w.r||w.role!=="w"||(BKP&&w.p===BKP))continue;const a=ageW(w);if(a<29&&w.o<(w.pot||70)&&R.chance(.25))w.o++;else if(a>37&&R.chance(.2))w.o--;}
}
function aiTitleChange(tid){
 const t=G.T[tid];const p=G.P[t.p];
 let pool=rosterOf(t.p,t.g).filter(w=>(!t.b||t.b==="main"||t.b==="all"||w.b===t.b)&&t.h.indexOf(w.id)<0);
 if(!pool.length)return;
 if(t.k==="tag"||t.k==="trios"){
  const n=t.k==="tag"?2:3;const teams={};pool.forEach(w=>{if(w.tm){(teams[w.tm]=teams[w.tm]||[]).push(w.id);}});
  let opts=Object.values(teams).filter(a=>a.length>=n&&a.indexOf(G.car.partner)<0);
  let pickT=opts.length&&R.chance(.8)?R.pick(opts).slice(0,n):R.shuffle(pool.filter(w=>w.id!==G.car.partner)).slice(0,n).map(w=>w.id);
  if(pickT.length<n)return;setChamp(tid,pickT);return;
 }
 const top=t.k==="world"?pool.slice(0,8):pool.slice(4,18);
 const w=R.wpick(top.length?top:pool,x=>Math.pow(x.o-40,2)+x.pop*4);if(!w)return;setChamp(tid,[w.id]);
}

 R.shuffle(movers).slice(0,3).forEach(w=>{w.fromP=w.p;w.p="fa";w.b="";addNews(`${nm(w.id)}'s contract with ${pn(w.fromP)} expires. ${pron(w.id,"He")} is now a free agent.`);});
 // last year's free agents sign somewhere
 Object.values(G.W).filter(w=>w.r&&w.p==="fa"&&w.faY!==y).forEach(w=>{if(w.faY===undefined){w.faY=y;return;}const opts=Object.values(G.P).filter(p=>p.r&&p.id!==w.fromP&&(!p.men||w.g==="m")&&(!p.women||w.g==="f"));const np=R.pick(opts);w.p=np.id;w.b=R.pick(np.brands.filter(b=>!b.dev)).id||np.brands[0].id;delete w.faY;addNews(`Free agent ${nm(w.id)} signs with ${pn(np.id)}.`);});

function gainStat(k,base){const m=G.me,s=m.st[k],c=m.cap[k];if(s>=c){if(R.chance(.05)&&s<99){m.st[k]=r1(s+.2);}return 0;}

const EXEC_ROLES=["None","Producer","Head of Creative","Executive Vice President"];
function wq(id){if(id==="me")return effOVR();const w=G.W[id];return w?w.o:50;}
function wp(id){if(id==="me")return popTop();const w=G.W[id];return w?w.pop:20;}
function fkey(a,b){return [a,b].sort().join("|");}
function autoCard(ros,titles,n,feuds){ros=ros.slice().sort((a,b)=>wq(b)+wp(b)-(wq(a)+wp(a)));const used={};const segs=[];
 const take=(pool)=>{const x=pool.find(id=>!used[id]);if(x)used[x]=1;return x;};
 for(const tid of titles){if(segs.length>=n-1)break;const t=G.T[tid];if(!t||!t.h.length||t.k!=="world"&&t.k!=="mid")continue;const h=t.h[0];if(used[h]||ros.indexOf(h)<0)continue;used[h]=1;const ch=take(ros.slice(0,10));if(ch)segs.push({a:[h],b:[ch],win:R.chance(.7)?"a":"b",tid});}
 const fk=Object.keys(feuds||{}).sort((a,b)=>feuds[b]-feuds[a]);for(const k of fk){if(segs.length>=n-1)break;const [a,b]=k.split("|");if(used[a]||used[b]||ros.indexOf(a)<0||ros.indexOf(b)<0)continue;used[a]=used[b]=1;segs.push({a:[a],b:[b],win:R.chance(.5)?"a":"b"});}
 while(segs.length<n){const a=take(ros);const b=take(ros);if(!a||!b)break;segs.push({a:[a],b:[b],win:R.chance(.5)?"a":"b"});}
 segs.sort((x,y)=>segStar(x)-segStar(y));return segs;}
function segStar(s){const ids=s.a.concat(s.b);return ids.reduce((t,id)=>t+wq(id)+wp(id)*.5,0)/ids.length;}
function predict(s,feuds){const ids=s.a.concat(s.b);const q=ids.reduce((t,id)=>t+wq(id),0)/ids.length;const h=feuds&&feuds[fkey(s.a[0],s.b[0])]||0;return clamp(.8+(q-40)*.065+h/60+(s.tid?.25:0),.5,5);}
function bookCard(ctx){G.bk=G.bk&&G.bk.ctxId===ctx.id?G.bk:{ctxId:ctx.id,segs:autoCard(ctx.roster,ctx.titles,ctx.n,ctx.feuds)};renderCard(ctx);}
function renderCard(ctx){const segs=G.bk.segs;const lbl=i=>i===segs.length-1?"Main event":i===0?"Opener":`Match ${i+1}`;
 const rows=segs.map((s,i)=>[lbl(i),`${esc(s.a.map(nm).join(" & "))} vs ${esc(s.b.map(nm).join(" & "))}${s.tid?`<br><span class="y">🏆 ${esc(tn(s.tid))}</span>`:""}`,`<b>${esc((s.win==="a"?s.a:s.b).map(nm).join(" & "))}</b>`,stars(Math.round(predict(s,ctx.feuds)*4)/4)||"½"]);
 show(`<div class="tag">BOOKING</div><h2>${esc(ctx.title)}</h2>${ctx.intro||""}${table(["Slot","Match","Winner","Projected"],rows)}<p class="dim small">Strong main events, hot feuds and title matches drive ratings. Talent who lose constantly get unhappy.</p>`,
  [{t:"▶ Run the show",cls:"hi",f:()=>runCard(ctx)}].concat(segs.map((s,i)=>({t:`Edit ${lbl(i).toLowerCase()}`,sub:`${esc(s.a.map(nm).join(" & "))} vs ${esc(s.b.map(nm).join(" & "))}`,f:()=>editSeg(ctx,i)}))).concat([{t:"Auto-book a fresh card",f:()=>{G.bk.segs=autoCard(R.shuffle(ctx.roster),ctx.titles,ctx.n,ctx.feuds);renderCard(ctx);}}]));}
function editSeg(ctx,i){const s=G.bk.segs[i];const used={};G.bk.segs.forEach((x,j)=>{if(j!==i)x.a.concat(x.b).forEach(id=>used[id]=1);});const free=ctx.roster.filter(id=>!used[id]);
 const alts=[];for(let k=0;k<7;k++){const sh=R.shuffle(free);if(sh.length<2)break;alts.push([sh[0],sh[1]]);}
 const ch=[{t:`Swap the winner (currently ${esc((s.win==="a"?s.a:s.b).map(nm).join(" & "))})`,f:()=>{s.win=s.win==="a"?"b":"a";renderCard(ctx);}}];
 const hold=ctx.titles.find(t=>G.T[t]&&G.T[t].h.length&&(s.a.indexOf(G.T[t].h[0])>=0||s.b.indexOf(G.T[t].h[0])>=0));
 if(hold&&!s.tid)ch.push({t:`Make it a title match: ${esc(tn(hold))}`,f:()=>{s.tid=hold;renderCard(ctx);}});
 if(s.tid)ch.push({t:"Make it a non-title match",f:()=>{s.tid=null;renderCard(ctx);}});
 alts.forEach(a=>ch.push({t:`${esc(nm(a[0]))} ${rb(Math.round(wq(a[0])),"sm")} vs ${esc(nm(a[1]))} ${rb(Math.round(wq(a[1])),"sm")}`,sub:`Projected ${stars(Math.round(predict({a:[a[0]],b:[a[1]]},ctx.feuds)*4)/4)||"½"}`,f:()=>{s.a=[a[0]];s.b=[a[1]];s.tid=null;renderCard(ctx);}}));
 ch.push({t:"Back",f:()=>renderCard(ctx)});show(`<h2>Edit segment</h2>`,ch);}
function runCard(ctx){const segs=G.bk.segs;G.bk=null;EFX=[];const out=[];let tot=0,wt=0;const meSeg=segs.find(s=>s.a.indexOf("me")>=0||s.b.indexOf("me")>=0);
 segs.forEach((s,i)=>{let st=s===meSeg?null:clamp(Math.round((predict(s,ctx.feuds)+R.gauss()*.45)*4)/4,.25,5);const w=i===segs.length-1?3:1;

/* ===================== BOOKER MODE: core helpers, new game setup ===================== */
function bkOn(){return !!(G&&G.mode==="booker"&&G.bk);}
function bkP(){return G.P[G.bk.pid];}
function bkCo(){return pn(G.bk.pid);}
function bkTr(w){if(!w)return [];if(!w.tr){const k=Object.keys(BK_TRAITS);const h=hashStr(w.id+"tr");const a=k[h%k.length];let b=k[(h>>>7)%k.length];if(b===a)b=k[(h>>>13)%k.length];w.tr=a===b?[a]:[a,b];}return w.tr;}
function hasTr(w,t){if(typeof w==="string")w=G.W[w];return !!w&&bkTr(w).indexOf(t)>=0;}
function trN(w){return bkTr(w).map(t=>BK_TRAITS[t].n).join(" · ");}
function sTr(w){if(!w.str)w.str=Object.keys(BK_STAFF_TR)[hashStr(w.id+"s")%Object.keys(BK_STAFF_TR).length];return w.str;}
function bkMo(w){if(typeof w==="string")w=G.W[w];if(!w)return 50;if(w.mo===undefined)w.mo=clamp(Math.round(40+(w.pop||0)/5),0,100);return w.mo;}
function bkMorV(w){if(typeof w==="string")w=G.W[w];if(!w)return 60;if(w.mor==null)w.mor=60;return w.mor;}
function bkMic(w){if(typeof w==="string")w=G.W[w];if(!w)return 50;let m=w.o*.42+(w.pop||0)*.38+12+(w.s==="sho"?12:0);if(hasTr(w,"showboat"))m+=8;if(hasTr(w,"creative"))m+=4;if(hasTr(w,"insecure"))m-=6;if(hasTr(w,"humble"))m-=3;if(w.role==="auth")m+=10;return clamp(Math.round(m),20,99);}
function bkStar(w){if(typeof w==="string")w=G.W[w];if(!w)return 40;return w.o*.5+(w.pop||0)*.35+bkMo(w)*.15;}
function bkInj(w){return !!(w&&w.binj&&w.binj.w>0);}
function bkAvail(w){if(typeof w==="string")w=G.W[w];if(!w||w.p!==G.bk.pid||w.role!=="w")return false;if(bkInj(w))return false;if(w.bc&&(w.bc.dev||w.bc.hold))return false;if((w.boff||0)>G.wk||(w.bsus||0)>G.wk)return false;return true;}
function bkWhyOut(w){if(bkInj(w))return `injured (${w.binj.n}, ${plural(w.binj.w,"wk")})`;if(w.bc&&w.bc.dev)return "in developmental";if(w.bc&&w.bc.hold)return "holding out";if((w.boff||0)>G.wk)return "on time off";if((w.bsus||0)>G.wk)return "suspended";return "";}
function bkRos(o){o=o||{};const a=[];for(const id in G.W){const w=G.W[id];if(w.p!==G.bk.pid||w.role!=="w")continue;if(!o.dev&&w.bc&&w.bc.dev)continue;if(o.devOnly&&!(w.bc&&w.bc.dev))continue;if(o.g&&o.g!=="a"&&w.g!==o.g)continue;if(o.b&&o.b!=="all"&&bkSplit()&&w.b!==o.b)continue;if(o.avail&&!bkAvail(w))continue;a.push(w);}return a.sort((x,y)=>bkStar(y)-bkStar(x));}
function bkSplit(){return G.bk.shows.filter(s=>!s.off).map(s=>s.brand).filter((b,i,a)=>b!=="all"&&a.indexOf(b)===i).length>1;}
function bkBrands(){const p=bkP();return p.brands.filter(b=>G.bk.shows.some(s=>s.brand===b.id&&!s.off));}
function bkBrandN(b){if(b==="all"||!b)return "All brands";const s=G.bk.shows.find(x=>x.brand===b);return s?bkShowN(s):b;}
function bkShowN(s){if(s.custom||!s.fic)return s.n;return fic()?s.fic:s.n;}
function bkPpvN(p){return p.custom?p.n:fx(p.n);}
function bkAge(w){return w.by?yearOf()-w.by:30;}
function bkSpot(w){const v=bkStar(w);return v>=80?4:v>=70?3:v>=60?2:v>=48?1:0;}
function bkStaff(k){const id=G.bk.staff[k];return id&&G.W[id]?G.W[id]:null;}
function bkSkill(k){const s=bkStaff(k);return s?s.o:30;}
function bkWB(w){return `${esc(nm(w.id))} ${rb(w.o,"sm")}`;}
function bkWSub(w,extra){const a=[(w.g==="f"?"Women's · ":"")+(STYLE_N[w.s]||"")+" · "+(ALIGN_N[w.al]||"Face")];a.push("Pop "+Math.round(w.pop||0)+" · Mom "+bkMo(w));const why=bkWhyOut(w);if(why)a.push(`<span class="r">${why}</span>`);if(w.tm)a.push(esc(teamNm(w)));if(extra)a.push(extra);return a.join(" · ");}
function bkTitlesOf(id){return bkP().titles.filter(t=>G.T[t]&&!G.T[t].ret&&G.T[t].h.indexOf(id)>=0);}

/* ---------- effect helpers (all push to EFX) ---------- */
function bkMor(id,d,quiet){const w=G.W[id];if(!w||id==="me"||!d)return;const b=bkMorV(w);w.mor=clamp(Math.round(b+d),0,100);if(!quiet&&w.mor-b)EFX.push([nm(id)+" morale",w.mor-b]);}
function bkMoD(id,d,quiet){const w=G.W[id];if(!w||id==="me"||!d)return;const b=bkMo(w);w.mo=clamp(Math.round(b+d),0,100);if(!quiet&&w.mo-b)EFX.push([nm(id)+" momentum",w.mo-b]);}
/* how famous anyone can get working for a company this size */
function bkPopCap(){return clamp(20+15*Math.log10(Math.max(1000,G.bk?G.bk.fans:1000)/1000),20,82);}
function bkPop(id,d,quiet){const w=G.W[id];if(!w||id==="me"||!d)return;const b=w.pop||0;let g=d;if(d>0)g=d*clamp(Math.pow(Math.max(0,100-b)/70,1.3),.05,1.3)*clamp((bkPopCap()+20-b)/40,.05,1);w.pop=clamp(r1(b+g),0,100);if(!quiet&&Math.abs(w.pop-b)>=.5)EFX.push([nm(id)+" popularity",r1(w.pop-b)]);}
function bkLed(k,d){const l=G.bk.led;l[k]=(l[k]||0)+Math.round(d);}
function bkCash(d,lbl,cat){d=Math.round(d);if(!d)return;bkLed(cat||lbl||"Other",d);if(G.bk.sandbox){if(lbl)EFX.push([lbl,d,"$"]);return;}G.bk.cash+=d;if(lbl)EFX.push([lbl,d,"$"]);}
function bkCanPay(x){return G.bk.sandbox||G.bk.cash>=x;}
function bkConf(d){const b=G.bk.board;if(!b||!d||G.bk.sandbox)return;const v=b.conf;b.conf=clamp(Math.round(v+d*(d<0?(BK_DIFF[G.bk.diff].board||1):1)),0,100);if(b.conf-v)EFX.push([G.bk.inv?"Investor confidence":"Board confidence",b.conf-v]);}
function bkNet(d){const n=G.bk.net;if(!d||G.bk.tv<2)return;const v=n.rel;n.rel=clamp(Math.round(v+d),0,100);if(n.rel-v)EFX.push(["Network relationship",n.rel-v]);}
function bkPres(d){const p=bkP();const v=p.pres;p.pres=clamp(r1(v+d),1,100);if(Math.round(p.pres)!==Math.round(v))EFX.push(["Prestige",Math.round(p.pres)-Math.round(v)]);}

function bkPred(E,s){const S=BK_STYLES[G.bk.style];const why=[];let v;
 if(s.t==="m"){const K=KINDS[s.k]||KINDS.singles;const ids=[].concat(...s.s);const ws=ids.map(id=>G.W[id]).filter(Boolean);if(ws.length<2||s.s.length<2)return {v:.5,why:["Not enough competitors"]};

  let heat=0;for(let i=0;i<s.s.length;i++)for(let j=i+1;j<s.s.length;j++)s.s[i].forEach(a=>s.s[j].forEach(b=>heat=Math.max(heat,bkFeudV(a,b))));const st=s.sid?bkStoryById(s.sid):bkStoryFor(ids);if(st)heat=Math.max(heat,st.heat*(s.sid===st.id?(E&&E.ppv?1.15:.85):.6));v+=heat/100*.75;if(heat>=50)why.push("Red-hot feud");else if(heat>=25)why.push("Built-up rivalry");

  const fm=({clean:0,dirty:-.05,dq:-.3,co:-.25,int:-.1,nc:-.4}[s.fin]||0)+(S.fin[s.fin]||0);v+=fm;if(fm<=-.3)why.push("Your crowd hates that finish");
  let sty=S.match||0;ws.forEach(w=>sty+=(S.pref[w.s]||0)/ws.length);sty+=S.kinds[s.k]||0;if(ws.every(w=>w.g==="f"))sty+=S.women||0;else if(S.men)sty+=S.men;if(S.faceWin&&s.win>=0&&s.s[s.win]&&bkSideAl(s.s[s.win])==="f"&&s.fin==="clean")sty+=S.faceWin;v+=sty;if(sty>=.2)why.push("Perfect for your crowd");else if(sty<=-.15)why.push("Not your crowd's taste");

  if(s.win>=0&&s.s[s.win]){const L=[].concat(...s.s.filter((x,i)=>i!==s.win));const W=s.s[s.win];if(L.some(l=>{const w=G.W[l];return w&&w.bc&&((w.bc.nojob||[]).some(x=>W.indexOf(x)>=0)||w.bc.cc)&&!s.ok;})){v-=.25;why.push("A loser refused this finish and may sandbag");}}}
 else if(s.t==="p"){const m=mean(s.w.map(id=>id==="me"?62:bkMic(id)));v=.6+(m-40)*.05+(S.talk||0);const al=bkSideAl(s.w);if((s.tone==="heel"&&al==="h")||(s.tone==="face"&&al==="f"))v+=.15;else if((s.tone==="heel"&&al==="f")||(s.tone==="face"&&al==="h")){v-=.2;why.push("Tone doesn't fit the character");}

  v+=(mean(s.w.map(id=>id==="me"?40:(G.W[id]||{}).pop||0))-50)/200;const id=bkIdeal(E,s);const d=(s.len||id)-id;if(Math.abs(d)>2){v-=Math.min(1,Math.abs(d)/id*.8);why.push(d>0?"Promo drags on":"Rushed promo");}

BST({id:"betrayal",n:"The Betrayal",cat:"Turn",d:"Two allies, one knife in the back. The oldest story in wrestling, done right.",roles:{a:["The loyal friend","face"],b:["The traitor","partner"]},beats:[

BST({id:"tagsplit",n:"Breaking Up the Band",cat:"Tag team",d:"A beloved tag team falls apart, and two singles careers are born from the wreckage.",roles:{a:["Partner one","any"],b:["Partner two","partner"]},beats:[

  ["They brawl to a no contest","Security can't hold them back. A rematch is inevitable.",{w:"x",f:"nc",h:10,q:2,ext:1}],

BST({id:"mystery",n:"The Mystery Attacker",cat:"Whodunit",d:"Someone is laying out the stars backstage. A suspect list, red herrings, and a big reveal.",roles:{a:["The victim","top"],b:["The real attacker","any"],c:["The red herring","any"]},pm:[["a"],["b"]],beats:[

BST({id:"invasion",n:"The Invasion",cat:"Faction",d:"A rogue faction declares war on the company. The home team has to band together.",roles:{a:["Home team captain","face"],d:["Home team ally","face"],b:["Invasion leader","heel"],c:["Invasion enforcer","heel"]},pm:[["a","d"],["b","c"]],pk:"tag",beats:[

function bkCustomScreen(){const c=BKC;const B=G.bk;
 const html=`<div class="tag">CUSTOM STORYLINE</div><h2>Write your own story</h2><p class="dim">Name it, cast it, choose the goal, then lay out the beats in order. The payoff is always a match between the two leads.</p>

 ${tiles([{l:"Lead (A)",v:c.r.a?esc(nm(c.r.a)):"—",sm:1},{l:"Opponent (B)",v:c.r.b?esc(nm(c.r.b)):"—",sm:1},{l:"Third wheel (optional)",v:c.r.c?esc(nm(c.r.c)):"—",sm:1},{l:"Goal",v:esc(BK_GOALS[c.goal].replace("{t}",c.t?tn(c.t):"the title").trim()),sm:1}])}

 const keep=()=>{const v=inval("cn");if(v!=null)c.n=v;};
 const pickRole=(k,lbl)=>{keep();bkPickIds({title:lbl,ids:bkRos({}).filter(w=>Object.keys(c.r).every(x=>x===k||c.r[x]!==w.id)&&(k==="a"||!c.r.a||w.g===G.W[c.r.a].g||k==="c")).map(w=>w.id),sub:id=>`${ALIGN_N[G.W[id].al]} · star ${Math.round(bkStar(id))}`,pick:id=>{c.r[k]=id;bkCustomScreen();},back:bkCustomScreen});};
 const ch=[{t:"Choose the lead (A)",f:()=>pickRole("a","The lead")},{t:"Choose the opponent (B)",f:()=>pickRole("b","The opponent")},{t:"Choose a third wheel (optional)",sub:"Used by the swerve beat",f:()=>pickRole("c","Third wheel")},
  {t:"Goal: "+esc(c.goal),sub:"Cycle: revenge, title, respect, power, honor",f:()=>{keep();const k=Object.keys(BK_GOALS);c.goal=k[(k.indexOf(c.goal)+1)%k.length];if(c.goal==="title"){const t=bkTitles().find(t=>G.T[t].h.some(h=>h===c.r.a||h===c.r.b))||bkTitles()[0];c.t=t||null;}else c.t=null;bkCustomScreen();}},
  {t:"+ Add a beat",sub:`${c.seq.length}/6 build beats`,dis:c.seq.length>=6?"Six is plenty":false,f:()=>{keep();show(`<h2>Add a beat</h2>`,Object.keys(BK_GB).filter(k=>k!=="swerve"||c.r.c).map(k=>({t:BK_GB[k][0],sub:BK_GB[k][1].replace(/\{a\}/g,"A").replace(/\{b\}/g,"B").replace(/\{x\}/g,"C"),f:()=>{c.seq.push(k);bkCustomScreen();}})).concat([{t:"Cancel",f:bkCustomScreen}]));}}];
 if(c.seq.length)ch.push({t:"Remove the last beat",f:()=>{keep();c.seq.pop();bkCustomScreen();}});
 ch.unshift({t:"🎬 Launch custom storyline",cls:"hi",dis:!(c.r.a&&c.r.b)?"Cast A and B":c.seq.length<1?"Add at least one beat":false,f:()=>{keep();const r={a:c.r.a,b:c.r.b};if(c.r.c)r.x=c.r.c;const st=bkLaunch(null,r,{n:(c.n||"").trim()||`${nm(c.r.a)} vs. ${nm(c.r.b)}`,seq:c.seq.map(k=>"g:"+k).concat(["pay"]),goal:c.goal,t:c.t});st.q=clamp(st.q+4,0,100);BKC=null;bkStoryView(st.id);}});

const BK_STAFF_APPR={oldschool:{authority:1,honest:1,humor:-1,flattery:-1},book:{authority:1,honest:1,humor:-1},yes:{flattery:1,authority:1,honest:1,empathy:1,humor:1,money:1},blunt:{honest:2,flattery:-2,empathy:-1},innov:{humor:1,honest:1,authority:-1},burned:{empathy:2,money:1,threat:-2,authority:-1},loyal:{honest:1,empathy:1,threat:-1},climber:{flattery:2,money:1,honest:-1}};
const BK_EXP_DEF={title:4,nojob:3,gimmick:4,pay:4,timeoff:3,partner:4,beef:3,holdout:12,poach:2,creative:4,release:4,friend:4,mentor:4,hurt:2,ref:3,social:2,expire:10,surge:3,sponsor:3,network:4,board:4,rival:3,legendcall:4,injury:3};
function bkSeenTr(id){return !!G.bk.seen["tr_"+id];}
function bkSee(id){G.bk.seen["tr_"+id]=1;}
function bkMood(w){const m=bkMorV(w);return m>=65?0:m>=40?1:2;}
function bkGreet(w){const t=bkTr(w)[0]||"pro";const L=(BK_GREET[t]||BK_GREET.pro)[bkMood(w)];return L[hashStr(w.id+G.wk)%L.length];}
function bkQuote(id,txt){return `<div class="quote"><b>${esc(nm(id))}:</b> “${esc(txt.replace(/^"|"$/g,""))}”</div>`;}
function bkReq(type,o){const B=G.bk;if(!B||!BK_REQ[type])return null;o=o||{};if(o.w&&B.inbox.some(r=>!r.done&&r.w===o.w&&r.type===type))return null;if(B.inbox.filter(r=>!r.done).length>=14&&!o.urg)return null;
 const r={id:"rq"+(++B.rid),type,w:o.w||null,o:o.o||null,urg:o.urg?1:0,exp:G.wk+(o.exp!=null?o.exp:BK_EXP_DEF[type]||4),wk:G.wk,kind:o.kind||"",amt:o.amt||0,done:0};B.inbox.push(r);if(B.inbox.length>60)B.inbox=B.inbox.filter(x=>!x.done).concat(B.inbox.filter(x=>x.done).slice(-20));return r;}
function bkReqDone(r){r.done=1;r.dw=G.wk;}
function bkReqTitle(r){const w=r.w&&G.W[r.w];const who=r.type==="rival"?pn(r.o):r.type==="sponsor"?r.kind.split("|")[0]:r.type==="network"?"Network executive":w?nm(w.id):"";return `${BK_REQ[r.type].ico} ${BK_REQ[r.type].n}${who?": "+who:""}`;}
/* ---------- persuasion ---------- */
function bkApprW(id,a){const w=G.W[id];if(!w)return 0;if(w.role==="w"){let s=0;bkTr(w).forEach(t=>{s+=((BK_TRAITS[t]||{}).appr||{})[a]||0;});return s;}return (BK_STAFF_APPR[sTr(w)]||{})[a]||0;}
function bkBonus(id){const w=G.W[id];return Math.max(500,Math.round((w&&w.role==="w"?bkAsk(w):40000)/25/100)*100);}
function bkPersuade(id,a,dc){const B=G.bk;const w=G.W[id];let s=52-(dc||0)+relOf(id)*.3+((w&&w.role==="w"?bkMorV(w):60)-50)*.3+(bkSkill("talent")-50)*.2+bkApprW(id,a)*14;
 if(a==="flattery"){const k="fl_"+id;const n=B.seen[k]||0;s-=Math.min(n,4)*7;B.seen[k]=n+1;}if(a==="threat")s-=6;if(a==="money")s+=12;
 const ok=R.int(1,100)<=clamp(Math.round(s),8,95);const line=R.pick(BK_APPR_LINES[a][ok?0:1]);
 if(a==="threat"){bkMor(id,-4);if(!ok)rel(id,-8);}if(a==="authority"&&!ok)rel(id,-5);if(a==="money"&&ok)bkCash(-bkBonus(id),"Bonus paid","Bonuses");if(ok)rel(id,a==="threat"?-2:3);else if(a!=="threat")bkMor(id,-2);
 return {ok,line};}
function bkApprCh(id,dc,done,lbl){return Object.keys(BK_APPR).map(a=>{const known=bkSeenTr(id)||G.W[id].role!=="w";const wv=bkApprW(id,a);return {t:`${lbl?lbl+": ":""}${BK_APPR[a]}`,sub:(a==="money"?`Costs ${money(bkBonus(id))} if they accept · `:"")+(a==="threat"?"Hurts morale either way · ":"")+(known?(wv>0?"<span class='g'>They respond well to this</span>":wv<0?"<span class='r'>They hate this</span>":"Neutral"):"Personality unknown"),f:()=>{EFX=[];const res=bkPersuade(id,a,dc);done(res,a);}};});}

/* ===================== STORYLINE ENGINE ===================== */
const EVENTS=[],EVM={};
function EV(o){if(o.cd===undefined)o.cd=40;o.w=o.w||1;o.st=o.st||[];EVENTS.push(o);EVM[o.id]=o;}
function queuePending(id,ctx){if(G.pending.some(p=>p.id===id&&JSON.stringify(p.ctx)===JSON.stringify(ctx||{})))return;G.pending.push({id,ctx:ctx||{},step:"start"});}
function later(id,weeks,ctx){G.sched.push({id,at:G.wk+weeks,ctx:ctx||{}});}
function stageTags(){const s=G.car.stage,t=[s,"any"];if(["dev","main","legend"].indexOf(s)>=0&&isMajor())t.push("major");if(["indie","regional","free"].indexOf(s)>=0)t.push("indies");if(["pre","backyard","school"].indexOf(s)>=0)t.push("early");if(G.exec&&G.exec.role)t.push("exec");if(G.own)t.push("own");if(G.me.retired)t.push("retired");else t.push("active");return t;}
function ctxValid(c){for(const k of ["id","id2","id3"])if(c[k]!==undefined&&!G.W[c[k]])return false;return true;}
function evAvailable(e){if(!e.st.length)return false;const s=G.evSeen[e.id];if(!s)return true;if(e.once)return false;return G.wk-s.t>=e.cd;}
function markSeen(id){const s=G.evSeen[id]||{n:0};s.n++;s.t=G.wk;G.evSeen[id]=s;}
function queueEvents(force){
 const due=G.sched.filter(s=>s.at<=G.wk);G.sched=G.sched.filter(s=>s.at>G.wk);
 due.forEach(s=>{const e=EVM[s.id];if(!e||!ctxValid(s.ctx))return;if(e.valid&&!e.valid(s.ctx))return;queuePending(s.id,s.ctx);markSeen(s.id);});
 if(force===true)return;
 const tags=stageTags();const n=G.me.retired?1:2;
 for(let i=0;i<n;i++){
  if(!R.chance(i===0?.42:.12))continue;
  const cands=[];
  for(const e of EVENTS){if(!evAvailable(e))continue;if(!e.st.some(t=>tags.indexOf(t)>=0))continue;if(G.pending.some(p=>p.id===e.id))continue;let c=null;try{c=e.cond?e.cond():{};}catch(err){c=null;}if(c)cands.push({e,c});}
  const ch=R.wpick(cands,x=>x.e.w);
  if(ch){queuePending(ch.e.id,ch.c);markSeen(ch.e.id);}
 }
}
function runEvent(inst){
 const e=EVM[inst.id];
 const drop=()=>{const i=G.pending.indexOf(inst);if(i>=0)G.pending.splice(i,1);};
 if(!e||!ctxValid(inst.ctx)||(e.valid&&!e.valid(inst.ctx))||(e.st.length&&(inst.step||"start")==="start"&&!e.st.some(t=>stageTags().indexOf(t)>=0))){drop();return continuePending();}
 let st;try{st=e.s[inst.step||"start"](inst.ctx);}catch(err){console.error(err);drop();return continuePending();}
 if(!st||!st.ch||!st.ch.length){drop();return continuePending();}
 const tag=e.tag||(e.st.length?"STORYLINE":"STORY");
 show(`<div class="tag">${tag}</div><h2>${e.t}</h2>${st.x.indexOf("<p")===0?st.x:`<p>${st.x}</p>`}`,st.ch.filter(Boolean).map(ch=>({t:ch[0],sub:ch[3]||"",dis:ch[2]||false,cls:ch[4]||"",f:()=>{
  EFX=[];let r;try{r=ch[1](inst.ctx);}catch(err){console.error(err);r="Events took an unexpected turn.";}
  const txt=typeof r==="string"?r:(r&&r.text)||"";
  if(r&&r.goto)inst.step=r.goto;else{drop();if(e.st.length)G.stats.events++;}
  G.log.push({wk:G.wk,t:e.t,c:String(ch[0]).replace(/<[^>]+>/g,"")});if(G.log.length>200)G.log.shift();
  checkAch();
  if(r&&r.screen)return r.screen();
  if(r&&r.goto&&!txt)return runEvent(inst);
  if(!txt&&!EFX.length)return continuePending();
  show(`<div class="tag">${tag}</div><h2>${e.t}</h2><p>${txt}</p>${efxHtml()}`,[{t:"Continue",cls:"hi",f:continuePending}]);
 }})));
}
